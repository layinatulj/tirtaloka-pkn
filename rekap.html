<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirtaloka PKn - Monitoring Rekap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-custom sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
        <div class="brand-icon-box"><i class="fas fa-table-cells"></i></div>
        <span class="brand-text">TIRTALOKA PKn</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <div class="text-end">
          <div class="fw-bold text-dark" id="userDisplayName">Pengguna</div>
          <small class="text-success fw-semibold" id="userRole">Guru</small>
        </div>
        <button class="btn btn-logout-circle" onclick="logout()"><i class="fas fa-power-off"></i></button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="mb-3">
      <a href="dashboard.html" class="btn btn-back-dashboard"><i class="fas fa-arrow-left me-1"></i> Dashboard</a>
    </div>

    <!-- Tabel Hasil Ujian Online -->
    <div class="main-panel-card mb-4">
      <h5 class="fw-bold text-success mb-3"><i class="fas fa-pen-to-square me-2"></i>Hasil Ujian Online</h5>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Nama Siswa</th>
              <th>Peran</th>
              <th>Kategori</th>
              <th>Skor</th>
              <th>Waktu</th>
            </tr>
          </thead>
          <tbody id="rekapUjianBody">
            <tr><td colspan="5" class="text-center py-3 text-muted"><i class="fas fa-spinner fa-spin me-2"></i>Memuat data ujian...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Tabel Hasil Mini-Game -->
    <div class="main-panel-card">
      <h5 class="fw-bold text-success mb-3"><i class="fas fa-gamepad me-2"></i>Hasil Mini-Game PKn</h5>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Nama Siswa</th>
              <th>Peran</th>
              <th>Kategori</th>
              <th>Skor</th>
              <th>Waktu</th>
            </tr>
          </thead>
          <tbody id="rekapGameBody">
            <tr><td colspan="5" class="text-center py-3 text-muted"><i class="fas fa-spinner fa-spin me-2"></i>Memuat data game...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
