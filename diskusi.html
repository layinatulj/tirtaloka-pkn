<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirtaloka PKn - Forum Diskusi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-custom sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
        <div class="brand-icon-box"><i class="fas fa-table-cells"></i></div>
        <span class="brand-text">TIRTALOKA PKn</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <div class="text-end">
          <div class="fw-bold text-dark" id="userDisplayName">Pengguna</div>
          <small class="text-success fw-semibold" id="userRole">Siswa</small>
        </div>
        <button class="btn btn-logout-circle" onclick="logout()"><i class="fas fa-power-off"></i></button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="mb-3">
      <a href="dashboard.html" class="btn btn-back-dashboard"><i class="fas fa-arrow-left me-1"></i> Dashboard</a>
    </div>

    <div class="main-panel-card">
      <h4 class="fw-bold text-success mb-4"><i class="fas fa-comments me-2"></i>Forum Diskusi Kelas</h4>

      <!-- Form Pembuat Tema Baru (Hanya Muncul di Tampilan Guru) -->
      <div id="guruFormDiskusi" class="card p-3 mb-4 border-0 bg-light" style="display: none;">
        <h6 class="fw-bold text-success mb-2"><i class="fas fa-plus-circle me-1"></i> Buat Tema Diskusi Baru</h6>
        <form onsubmit="handleCreateTema(event)">
          <div class="row g-2 mb-2">
            <div class="col-md-4">
              <input type="text" id="newTemaId" class="form-control" placeholder="ID Diskusi (Misal: DISK02)" required>
            </div>
            <div class="col-md-8">
              <input type="text" id="newTemaJudul" class="form-control" placeholder="Judul / Tema Pembahasan" required>
            </div>
          </div>
          <textarea id="newTemaPesan" class="form-control mb-2" rows="2" placeholder="Pesan / Pertanyaan Pemantik dari Guru..." required></textarea>
          <button type="submit" class="btn btn-emerald btn-sm"><i class="fas fa-paper-plane me-1"></i> Terbitkan Tema</button>
        </form>
      </div>

      <!-- Tata Letak Dua Kolom: Menu Tema & Isi Diskusi -->
      <div class="row">
        <!-- Kolom Kiri: Menu Topik Diskusi -->
        <div class="col-md-4 border-end pe-md-3 mb-4 mb-md-0">
          <h6 class="fw-bold text-dark mb-3"><i class="fas fa-list me-2"></i>Pilih Topik Diskusi</h6>
          <div class="list-group list-group-flush" id="listTemaMenu">
            <!-- Menu topik dimuat otomatis dari JS -->
          </div>
        </div>

        <!-- Kolom Kanan: Detail Pesan & Input Balasan -->
        <div class="col-md-8 ps-md-4">
          <div id="diskusiHeaderArea" class="mb-3 pb-2 border-bottom">
            <h5 class="fw-bold text-success mb-1" id="activeTopicTitle">Pilih Topik Diskusi</h5>
            <small class="text-muted" id="activeTopicSub">Silakan klik salah satu topik di sebelah kiri untuk melihat pesan.</small>
          </div>

          <!-- Area Chat/Pesan Diskusi -->
          <div id="diskusiContainer" class="d-flex flex-column gap-2 mb-4" style="max-height: 400px; overflow-y: auto;">
            <div class="text-muted">Pilih topik terlebih dahulu...</div>
          </div>

          <!-- Form Kirim Balasan -->
          <form id="formReplyDiskusi" onsubmit="handleSendReply(event)" class="d-flex gap-2">
            <input type="text" id="inputBalasanPesan" class="form-control" placeholder="Tulis tanggapan kamu..." required disabled>
            <button type="submit" id="btnSendReply" class="btn btn-emerald" disabled><i class="fas fa-paper-plane"></i></button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
