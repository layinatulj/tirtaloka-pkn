<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirtaloka PKn - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="main-panel-card text-center" style="max-width: 420px; width: 100%;">
      <div class="brand-icon-box mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.8rem;">
        <i class="fas fa-table-cells"></i>
      </div>
      <h3 class="fw-bold text-success mb-1">Tirtaloka Learning</h3>
      <p class="text-muted mb-4 small">Pendidikan Pancasila & Kewarganegaraan SMP</p>
      
      <form onsubmit="handleLogin(event)">
        <div class="mb-3 text-start">
          <label class="form-label fw-semibold small">Nama Lengkap</label>
          <input type="text" id="loginNama" class="form-control" placeholder="Masukkan Nama" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label fw-semibold small">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan Password" required>
        </div>
        <button type="submit" class="btn btn-emerald w-100 mt-2">
          Masuk Pembelajaran <i class="fas fa-arrow-right ms-1"></i>
        </button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
